name: Build Android APK

on:
  push:
    tags: ['v*']          # كل وسم يبدأ بـ v (مثل v0.14.0) ينتج إصدارًا برابط تنزيل
  workflow_dispatch:       # أو تشغيل يدوي من تبويب Actions (ينتج ملفًا للتجربة فقط)

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build web app
        run: node build.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "ANDROID_KEYSTORE_B64 secret is missing" >&2; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          V=$(node -p "require('./package.json').version")
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../Docs-Asset-Studio-${APP_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Docs-Asset-Studio-apk
          path: Docs-Asset-Studio-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Docs-Asset-Studio-*.apk
          generate_release_notes: true
